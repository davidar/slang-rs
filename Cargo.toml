[package]
name = "shader-slang"
version = "0.1.0"
edition = "2024"
description = "Rust bindings for the Slang shader language compiler"
repository = "https://github.com/FloatyMonkey/slang-rs"
license = "MIT OR Apache-2.0"
categories = ["compilers", "api-bindings"]

[dependencies]
libloading = "0.8"
shader-slang-sys = { path = "slang-sys", version = "0.1.0", default-features = false }

[dev-dependencies]
sha2 = "0.10"

[features]
default = ["embed"]
# Embed the pinned official Slang release in the binary (see README).
embed = ["shader-slang-sys/embed"]
serde = ["shader-slang-sys/serde"]
# Link Slang at build time instead of opening it at run time; see README.
system = ["shader-slang-sys/system"]

[workspace]
members = [
	"slang-sys"
]
